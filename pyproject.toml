[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synergy-meta-os"
version = "31.0.0rc1"
description = "Signed, capability-bounded SYNERGY node supervisor"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.scripts]
synergy-meta-os = "synergy_meta_os.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
