name: v31 signed durable supervisor

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: PYTHONWARNINGS=error::ResourceWarning python -m unittest discover -s tests -v
      - run: python tools/qualify_v31.py --output build-evidence/QUALIFICATION.json
        env:
          PYTHONPATH: src
      - uses: actions/upload-artifact@v4
        with:
          name: v31-qualification-py${{ matrix.python-version }}
          path: build-evidence/QUALIFICATION.json

