name: AUTOPILOT V5 AI Node Production Bootstrap v5
on:
  pull_request:
    paths:
      - 'production/autopilot_v5_ai_node_production_bootstrap_contract_v5.json'
      - 'src/synergy_meta_os/production_bootstrap_v5.py'
      - 'tests/test_production_bootstrap_v5.py'
      - 'docs/AUTOPILOT_V5_AI_NODE_PRODUCTION_BOOTSTRAP_V5_20260824.md'
      - '.github/workflows/autopilot-v5-ai-node-production-bootstrap-v5.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest tests/test_production_bootstrap_v5.py -v
      - name: Confirm default remains fail-closed
        run: |
          python - <<'PY'
          from synergy_meta_os.production_bootstrap_v5 import load_default, assess
          result = assess(load_default())
          assert result['startup_allowed'] is False
          assert len(result['missing']) == 7
          print(result)
          PY
