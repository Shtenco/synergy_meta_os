name: Research Node Build Lock Consumer v1

on:
  pull_request:
    paths:
      - 'src/synergy_meta_os/node_build_lock_consumer_v1.py'
      - 'fixtures/node_build_locks/research_compute_node_source_candidate_v1.json'
      - 'schemas/synergy_node_build_lock_v1.schema.json'
      - 'tests/test_research_node_build_lock_consumer_v1.py'
      - 'tests/test_research_node_build_lock_schema_v1.py'
      - 'docs/RESEARCH_NODE_BUILD_LOCK_CONSUMER_V1.md'
      - '.github/workflows/research-node-build-lock-consumer-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest jsonschema cryptography
      - run: python -m pip install -e .
      - run: pytest -q tests/test_research_node_build_lock_consumer_v1.py tests/test_research_node_build_lock_schema_v1.py
