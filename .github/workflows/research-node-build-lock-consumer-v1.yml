name: Research Node Build Lock Consumer v1

on:
  pull_request:
    paths:
      - 'fixtures/node_build_locks/research_compute_node_source_candidate_v1.json'
      - 'src/synergy_meta_os/node_build_lock_consumer_v1.py'
      - 'tests/test_research_node_build_lock_consumer_v1.py'
      - 'docs/RESEARCH_NODE_BUILD_LOCK_CONSUMER_V1.md'
      - '.github/workflows/research-node-build-lock-consumer-v1.yml'
  workflow_dispatch:

concurrency:
  group: research-node-build-lock-consumer-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_research_node_build_lock_consumer_v1.py
