name: Research Node Admission v1

on:
  pull_request:
    paths:
      - 'admissions/research_compute_node_admission_v1.json'
      - 'evidence/research_compute_node_*_v4.json'
      - 'src/synergy_meta_os/**'
      - 'tests/test_admission_v1.py'
      - '.github/workflows/research-node-admission-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q tests/test_admission_v1.py
