name: Meta-OS Node Manifest v1

on:
  pull_request:
    paths:
      - "src/synergy_meta_os/**"
      - "tests/**"
      - "docs/NODE_MANIFEST_V1.md"
      - ".github/workflows/node-manifest-v1.yml"
  push:
    paths:
      - "src/synergy_meta_os/**"
      - "tests/**"
      - "docs/NODE_MANIFEST_V1.md"
      - ".github/workflows/node-manifest-v1.yml"

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: python -m pytest -q
      - run: python -m py_compile src/synergy_meta_os/*.py
