name: AUTOPILOT V5 AI Node Production Bootstrap v2
on:
  pull_request:
    paths:
      - 'production/autopilot_v5_ai_node_production_bootstrap_contract_v2.json'
      - 'src/synergy_meta_os/production_bootstrap_v2.py'
      - 'tests/test_production_bootstrap_v2.py'
      - 'docs/AUTOPILOT_V5_AI_NODE_PRODUCTION_BOOTSTRAP_V2_20260823.md'
      - '.github/workflows/autopilot-v5-ai-node-production-bootstrap-v2.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest tests/test_production_bootstrap_v2.py -v
