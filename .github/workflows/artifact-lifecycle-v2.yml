name: Meta-OS Artifact Lifecycle v2

on:
  pull_request:
    paths:
      - 'src/synergy_meta_os/runtime_v2.py'
      - 'tests/test_runtime_v2.py'
      - 'docs/ARTIFACT_STORE_LIFECYCLE_V2.md'
      - '.github/workflows/artifact-lifecycle-v2.yml'
  workflow_dispatch:

concurrency:
  group: meta-os-artifact-lifecycle-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_runtime_v2.py
