name: science-node-admission-decision-v2

on:
  pull_request:
    paths:
      - 'fixtures/node_admission/science_research_node_blocked_build_v2.json'
      - 'schemas/synergy_node_admission_decision_v2.schema.json'
      - 'src/synergy_meta_os/node_admission_decision_v2.py'
      - 'tests/test_science_node_admission_decision_v2.py'
      - 'docs/NODE_ADMISSION_DECISION_V2.md'
      - '.github/workflows/science-node-admission-decision-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest cryptography
      - run: PYTHONPATH=src pytest -q tests/test_science_node_admission_decision_v2.py
      - run: python -m json.tool fixtures/node_admission/science_research_node_blocked_build_v2.json >/dev/null
      - run: python -m json.tool schemas/synergy_node_admission_decision_v2.schema.json >/dev/null
