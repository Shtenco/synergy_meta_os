name: AUTOPILOT V5 AI Node LAB Deployment v1

on:
  pull_request:
    paths:
      - 'host_profiles/synergy_autopilot_v5_ai_node_lab_host_profile_v1.json'
      - 'supervisors/synergy_autopilot_v5_ai_node_lab_supervisor_v1.json'
      - 'runtime_shims/lab_node_resident_v1.py'
      - 'evidence/synergy_autopilot_v5_ai_node_lab_deployment_evidence_v1.json'
      - 'deployments/synergy_autopilot_v5_ai_node_lab_deployment_result_v1.json'
      - 'src/synergy_meta_os/autopilot_ai_node_lab_deployment_v1.py'
      - 'tests/test_autopilot_ai_node_lab_deployment_v1.py'
      - '.github/workflows/autopilot-v5-ai-node-lab-deployment-v1.yml'
  workflow_dispatch:

jobs:
  verify-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_autopilot_ai_node_lab_deployment_v1.py
