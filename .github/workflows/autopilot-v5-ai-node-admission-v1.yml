name: AUTOPILOT V5 AI Node Admission v1

on:
  pull_request:
    paths:
      - 'profiles/synergy_autopilot_v5_ai_node_profile_v1.json'
      - 'admissions/synergy_autopilot_v5_ai_node_admission_v1.json'
      - 'src/synergy_meta_os/autopilot_ai_node_admission_v1.py'
      - 'tests/test_autopilot_ai_node_admission_v1.py'
      - '.github/workflows/autopilot-v5-ai-node-admission-v1.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_autopilot_ai_node_admission_v1.py
