name: AUTOPILOT V5 AI Node Production Bootstrap v4
on:
  pull_request:
    paths:
      - 'production/autopilot_v5_ai_node_production_bootstrap_contract_v4.json'
      - 'production/autopilot_v5_ai_node_production_inputs_template_v1.json'
      - 'src/synergy_meta_os/production_bootstrap_v4.py'
      - 'scripts/collect_production_host_profile_v1.py'
      - 'scripts/verify_production_host_profile_v1.py'
      - 'tests/test_production_bootstrap_v4.py'
      - 'docs/AUTOPILOT_V5_AI_NODE_PRODUCTION_BOOTSTRAP_V4_20260824.md'
      - '.github/workflows/autopilot-v5-ai-node-production-bootstrap-v4.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest tests/test_production_bootstrap_v4.py -v
      - name: Assert default contract remains blocked
        run: |
          python - <<'PY'
          from synergy_meta_os.production_bootstrap_v4 import assess, load_default
          result = assess(load_default())
          assert result['status'] == 'BLOCKED_AWAITING_REAL_PERSISTENT_PRODUCTION_HOST_AND_FRESH_DEPLOYMENT_EVIDENCE'
          assert result['startup_allowed'] is False
          assert result['current_running'] is False
          assert len(result['missing']) == 7
          print(result)
          PY
      - name: Assert host collector fails without explicit persistent-host attestation
        run: |
          set +e
          python scripts/collect_production_host_profile_v1.py \
            --attestation NOT_A_PRODUCTION_ATTESTATION \
            --production-root "$PWD" \
            --output /tmp/should-not-exist-production-host-profile.json
          code=$?
          test "$code" -ne 0
          test ! -e /tmp/should-not-exist-production-host-profile.json
