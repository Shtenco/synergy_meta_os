name: economic-testnet-external-deployment-gate-v1

on:
  pull_request:
    paths:
      - 'src/synergy_meta_os/economic_testnet_external_deployment_gate_v1.py'
      - 'production/economic_testnet_external_deployment_gate_v1.json'
      - 'tests/test_economic_testnet_external_deployment_gate_v1.py'
      - 'docs/ECONOMIC_TESTNET_EXTERNAL_DEPLOYMENT_GATE_V1_20260828.md'
      - '.github/workflows/economic-testnet-external-deployment-gate-v1.yml'
  workflow_dispatch:

jobs:
  deployment-gate-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: pytest -q tests/test_economic_testnet_external_deployment_gate_v1.py
