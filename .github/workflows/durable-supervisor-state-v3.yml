name: Meta OS Durable Supervisor State v3

on:
  pull_request:
    paths:
      - 'src/synergy_meta_os/durable_state_v3.py'
      - 'tests/test_durable_state_v3.py'
      - 'docs/DURABLE_SUPERVISOR_STATE_V3.md'
      - '.github/workflows/durable-supervisor-state-v3.yml'
  workflow_dispatch:

concurrency:
  group: meta-os-durable-state-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  durable-state:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_durable_state_v3.py
